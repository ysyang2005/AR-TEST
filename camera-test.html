<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>相機測試</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    color: #fff;
    font-family: -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  h1 { font-size: 20px; margin-bottom: 8px; }
  .env { font-size: 12px; color: #888; margin-bottom: 24px; font-family: monospace; }
  video {
    width: 100%;
    max-width: 400px;
    border-radius: 12px;
    border: 2px solid #333;
    background: #000;
    margin-bottom: 20px;
  }
  button {
    padding: 14px 32px;
    background: #06b6d4;
    color: #fff;
    border: none;
    border-radius: 25px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin: 8px;
  }
  button:hover { background: #0891b2; }
  button:disabled { background: #555; cursor: not-allowed; }
  .status {
    margin-top: 20px;
    padding: 16px;
    border-radius: 8px;
    max-width: 400px;
    width: 100%;
    font-size: 14px;
    line-height: 1.6;
    text-align: center;
  }
  .status.success { background: rgba(34,197,94,0.15); color: #4ade80; border: 1px solid rgba(34,197,94,0.3); }
  .status.error { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.3); }
  .status.info { background: rgba(6,182,212,0.1); color: #67e8f9; border: 1px solid rgba(6,182,212,0.2); }
  .guide {
    margin-top: 24px;
    padding: 16px;
    background: rgba(255,255,255,0.05);
    border-radius: 8px;
    max-width: 400px;
    width: 100%;
    font-size: 13px;
    color: #aaa;
    line-height: 1.8;
  }
  .guide strong { color: #fff; }
  code { background: rgba(6,182,212,0.15); color: #06b6d4; padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>

<h1>📷 相機測試頁面</h1>
<div class="env" id="env"></div>

<video id="video" autoplay playsinline muted></video>

<button id="startBtn">開啟相機</button>
<button id="stopBtn" disabled>關閉相機</button>

<div class="status info" id="status">點擊「開啟相機」按鈕測試</div>

<div class="guide">
  <strong>如果打不開相機，請檢查：</strong><br>
  1. 網址必須是 <code>http://localhost:8080</code>，不是 <code>file://</code><br>
  2. 瀏覽器彈出權限請求時，點「允許」<br>
  3. 如果之前拒絕過，點擊網址欄左側的 🔒 圖示 → 網站設定 → 相機 → 重設<br>
  4. 確認沒有其他程式佔用相機（如 Zoom、Meet）
</div>

<script>
  const video = document.getElementById('video');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const statusEl = document.getElementById('status');
  const envEl = document.getElementById('env');
  let stream = null;

  // 顯示運行環境
  envEl.textContent = '當前網址：' + window.location.href;

  // 檢測是否為 file://
  if (window.location.protocol === 'file:') {
    statusEl.className = 'status error';
    statusEl.innerHTML = '❌ 檢測到 file:// 協議<br>瀏覽器在 file:// 下不會允許相機訪問<br><br>請在終端機執行：<br><code>python3 -m http.server 8080</code><br>然後打開 <code>http://localhost:8080</code>';
    startBtn.disabled = true;
  }

  startBtn.addEventListener('click', async () => {
    startBtn.disabled = true;
    statusEl.className = 'status info';
    statusEl.textContent = '正在請求相機權限…';

    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment' },
        audio: false
      });
      video.srcObject = stream;
      statusEl.className = 'status success';
      statusEl.textContent = '✅ 相機開啟成功！';
      startBtn.disabled = true;
      stopBtn.disabled = false;
    } catch (err) {
      console.error(err);
      statusEl.className = 'status error';
      let msg = '❌ 相機開啟失敗<br><br>';
      if (err.name === 'NotAllowedError') {
        msg += '錯誤類型：NotAllowedError（你已拒絕相機權限）<br><br>解決方法：點擊網址欄左側的 🔒 圖示 → 網站設定 → 相機 → 重設為預設，然後重新整理頁面';
      } else if (err.name === 'NotFoundError') {
        msg += '錯誤類型：NotFoundError（找不到相機設備）<br><br>解決方法：確認電腦有連接攝影機';
      } else if (err.name === 'NotReadableError') {
        msg += '錯誤類型：NotReadableError（相機被佔用）<br><br>解決方法：關閉其他使用相機的程式（Zoom、Meet 等）';
      } else if (err.name === 'SecurityError') {
        msg += '錯誤類型：SecurityError（安全錯誤）<br><br>解決方法：確認在 localhost 或 HTTPS 下運行';
      } else {
        msg += '錯誤類型：' + err.name + '<br>錯誤訊息：' + err.message;
      }
      statusEl.innerHTML = msg;
      startBtn.disabled = false;
    }
  });

  stopBtn.addEventListener('click', () => {
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
      stream = null;
      video.srcObject = null;
    }
    statusEl.className = 'status info';
    statusEl.textContent = '相機已關閉';
    startBtn.disabled = false;
    stopBtn.disabled = true;
  });
</script>

</body>
</html>
