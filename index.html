<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>MindAR 极简测试 v3</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, sans-serif;
    }
    #ar-container {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    #status {
      position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
      padding: 12px 16px; color: #fff; font-size: 14px; font-weight: 600;
      background: rgba(0,0,139,0.85); text-align: center;
    }
    #status.found { background: rgba(34,139,34,0.9); }
    #debug {
      position: fixed; bottom: 10px; left: 10px; z-index: 9999;
      color: #0f0; font-size: 10px; font-family: monospace;
      background: rgba(0,0,0,0.8); padding: 8px; border-radius: 4px;
      max-width: 90vw; line-height: 1.4;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="ar-container"></div>
  <div id="status">v3 初始化中...</div>
  <div id="debug"></div>

  <script type="module">
    import * as THREE from 'three';
    import { MindARThree } from 'https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js';

    const statusEl = document.getElementById('status');
    const debugEl = document.getElementById('debug');
    const container = document.getElementById('ar-container');
    let logs = [];
    function log(msg) {
      logs.push(msg);
      if (logs.length > 15) logs.shift();
      debugEl.textContent = logs.join('\n');
      console.log('[AR]', msg);
    }

    log('v3 - page loaded');
    log('container size: ' + container.clientWidth + 'x' + container.clientHeight);

    try {
      const mindarThree = new MindARThree({
        container: container,
        imageTargetSrc: './targets_improved.mind',
        uiLoading: 'no',
        uiScanning: 'no',
        uiError: 'no',
      });
      log('MindARThree created');

      const { renderer, scene, camera } = mindarThree;
      log('renderer size: ' + renderer.domElement.width + 'x' + renderer.domElement.height);
      log('scene children: ' + scene.children.length);

      // Light
      scene.add(new THREE.AmbientLight(0xffffff, 1.0));
      scene.add(new THREE.DirectionalLight(0xffffff, 0.8));

      // Anchor
      const anchor = mindarThree.addAnchor(0);
      log('anchor created, group.visible=' + anchor.group.visible);

      // BIG RED CUBE - impossible to miss
      const cube = new THREE.Mesh(
        new THREE.BoxGeometry(0.5, 0.5, 0.5),
        new THREE.MeshBasicMaterial({ color: 0xff0000 })
      );
      cube.position.z = 0.3;
      anchor.group.add(cube);
      log('red cube added to anchor.group');
      log('anchor.group.children: ' + anchor.group.children.length);

      // Blue plane on target
      const plane = new THREE.Mesh(
        new THREE.PlaneGeometry(1, 1.5),
        new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.4, side: THREE.DoubleSide })
      );
      plane.position.z = 0.01;
      anchor.group.add(plane);
      log('blue plane added');

      anchor.onTargetFound = () => {
        statusEl.textContent = '✓ 识别成功！';
        statusEl.className = 'found';
        log('>>> TARGET FOUND <<<');
        log('group.visible=' + anchor.group.visible);
        log('group.matrix=' + JSON.stringify(Array.from(anchor.group.matrix.elements)).substring(0, 80));
        log('cube.visible=' + cube.visible + ' cube.position=' + cube.position.x.toFixed(2) + ',' + cube.position.y.toFixed(2) + ',' + cube.position.z.toFixed(2));
        log('renderer.domElement size: ' + renderer.domElement.width + 'x' + renderer.domElement.height);
        log('container size: ' + container.clientWidth + 'x' + container.clientHeight);
      };
      anchor.onTargetLost = () => {
        statusEl.textContent = '目标丢失';
        statusEl.className = '';
        log('TARGET LOST');
      };

      statusEl.textContent = '启动摄像头...';
      await mindarThree.start();
      log('AR started');
      log('renderer size after start: ' + renderer.domElement.width + 'x' + renderer.domElement.height);
      log('camera fov: ' + camera.fov.toFixed(1) + ' aspect: ' + camera.aspect.toFixed(2));
      statusEl.textContent = '就绪！对准甲骨文';

      // Render loop
      let frameCount = 0;
      renderer.setAnimationLoop(() => {
        frameCount++;
        cube.rotation.y += 0.02;
        renderer.render(scene, camera);
        if (frameCount % 120 === 0) {
          log('render frame ' + frameCount + ', scene children: ' + scene.children.length);
        }
      });
      log('render loop started');

    } catch (err) {
      log('FATAL: ' + err.message);
      log(err.stack ? err.stack.substring(0, 200) : '');
      statusEl.textContent = '错误: ' + err.message;
      statusEl.style.background = 'rgba(139,0,0,0.9)';
      console.error(err);
    }
  </script>
</body>
</html>
